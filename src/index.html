<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>animeSnake</title>
<style>
  html, body { margin: 0; height: 100%; background: #14101f; color: #f3e9ff; font-family: system-ui, sans-serif; overflow: hidden; touch-action: none; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; }
  #hud { display: flex; gap: 24px; font-size: 16px; }
  canvas { background: #1d1730; border: 2px solid #3a2d5c; max-width: 96vw; max-height: 80vh; }
  #hint { font-size: 12px; opacity: .6; }
</style>
</head>
<body>
<div id="hud"><span>Score <b id="score">0</b></span><span>Chain <b id="len">3</b></span><span>Best <b id="best">0</b></span></div>
<canvas id="c" width="480" height="480"></canvas>
<div id="hint">Arrows / WASD / swipe to steer. Tap to restart after dying.</div>
<script>
const COLS = 20, ROWS = 20, CELL = 24, TICK_MS = 130;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const COLORS = ['#ff6b9d', '#6bc5ff', '#ffd36b', '#8dff6b', '#c78bff']; // placeholder "characters"
let snake, dir, nextDir, food, score, alive, best = 0, last = 0;

function reset() {
  snake = [
    { x: 10, y: 10, c: 0 },
    { x: 9, y: 10, c: 1 },
    { x: 8, y: 10, c: 2 },
  ];
  dir = nextDir = { x: 1, y: 0 };
  score = 0; alive = true;
  placeFood(); hud();
}
function placeFood() {
  do { food = { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) }; }
  while (snake.some(s => s.x === food.x && s.y === food.y));
}
function hud() {
  document.getElementById('score').textContent = score;
  document.getElementById('len').textContent = snake.length;
  document.getElementById('best').textContent = best;
}
function setDir(x, y) {
  if (x === -dir.x && y === -dir.y) return; // no instant reverse
  nextDir = { x, y };
}
function step() {
  dir = nextDir;
  const h = snake[0];
  const nx = h.x + dir.x, ny = h.y + dir.y;
  if (nx < 0 || ny < 0 || nx >= COLS || ny >= ROWS || snake.some(s => s.x === nx && s.y === ny)) {
    alive = false; return;
  }
  const ate = nx === food.x && ny === food.y;
  const tail = snake[snake.length - 1];
  snake.unshift({ x: nx, y: ny, c: 0 });
  if (ate) {
    snake[snake.length - 1].c = Math.floor(Math.random() * COLORS.length);
    score += 10; placeFood();
  } else snake.pop();
  if (score > best) best = score;
  hud();
}
function draw() {
  ctx.clearRect(0, 0, cv.width, cv.height);
  ctx.fillStyle = '#ff4d4d';
  ctx.fillRect(food.x * CELL + 4, food.y * CELL + 4, CELL - 8, CELL - 8);
  snake.forEach((s, i) => {
    ctx.fillStyle = COLORS[s.c % COLORS.length];
    ctx.fillRect(s.x * CELL + 1, s.y * CELL + 1, CELL - 2, CELL - 2);
    if (i === 0) { ctx.fillStyle = '#fff'; ctx.fillRect(s.x * CELL + 8, s.y * CELL + 8, 8, 8); }
  });
  if (!alive) {
    ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.fillStyle = '#fff'; ctx.font = '28px system-ui'; ctx.textAlign = 'center';
    ctx.fillText('Game over', cv.width / 2, cv.height / 2 - 8);
    ctx.font = '16px system-ui'; ctx.fillText('Tap or press Space to restart', cv.width / 2, cv.height / 2 + 22);
  }
}
function loop(t) {
  if (alive && t - last >= TICK_MS) { last = t; step(); }
  draw(); requestAnimationFrame(loop);
}
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (!alive && (k === ' ' || k === 'enter')) return reset();
  if (k === 'arrowup' || k === 'w') setDir(0, -1);
  else if (k === 'arrowdown' || k === 's') setDir(0, 1);
  else if (k === 'arrowleft' || k === 'a') setDir(-1, 0);
  else if (k === 'arrowright' || k === 'd') setDir(1, 0);
});
let tx, ty;
addEventListener('touchstart', e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; if (!alive) reset(); });
addEventListener('touchmove', e => {
  const dx = e.touches[0].clientX - tx, dy = e.touches[0].clientY - ty;
  if (Math.abs(dx) < 24 && Math.abs(dy) < 24) return;
  if (Math.abs(dx) > Math.abs(dy)) setDir(dx > 0 ? 1 : -1, 0); else setDir(0, dy > 0 ? 1 : -1);
  tx = e.touches[0].clientX; ty = e.touches[0].clientY;
});
reset(); requestAnimationFrame(loop);
</script>
</body>
</html>
