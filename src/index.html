<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>animeSnake</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="c" width="640" height="640"></canvas>
<div id="dock">
  <div id="panel"></div>
  <button id="panelHandle" type="button" tabindex="-1" aria-label="Hold to show or hide the info bar"></button>
</div>
<div id="hint">Arrows / WASD / swipe to steer. P pauses. I, or hold the small bar under the game, shows or hides the info bar. Eat a key, then touch the jumping character to recruit it. After dying: any key or tap revives, Q gives up.</div>

<!-- Plain scripts (no server or build step needed). Order matters: each file may use the ones above it
     when it loads, and every function in any file when the game runs. -->
<script src="config.js"></script>   <!-- constants and tuning numbers -->
<script src="sprites.js"></script>  <!-- loads the shared sprite sheets, defines HEADS -->
<script src="followers.js"></script><!-- the 5 followers (body characters), their sheets, newSlot() -->
<script src="state.js"></script>    <!-- the S object: all mutable game state, newRun() -->
<script src="storage.js"></script>  <!-- saves best score and best combo in the browser -->
<script src="unlocks.js"></script>  <!-- click-to-buy unlocks (heroes now, more later) -->
<script src="world.js"></script>    <!-- food, hazard, drop effects -->
<script src="score.js"></script>    <!-- points, combos, floating score text -->
<script src="player.js"></script>   <!-- steering, moving, rings and damage -->
<script src="attacks.js"></script>  <!-- attack definitions, swing timer, hit resolution -->
<script src="heads.js"></script>    <!-- the 3 playable heads: weapons and passives -->
<script src="skills.js"></script>   <!-- active skills carried by followers (the Miner's mines) -->
<script src="mines.js"></script>    <!-- mines on the map and their explosions -->
<script src="passives.js"></script> <!-- follower passives (Raiden, Keysman, Magneto, Medusa) -->
<script src="recruits.js"></script>  <!-- keys summon characters that walk in and wait to be recruited -->
<script src="merge.js"></script>
<script src="buffs.js"></script>    <!-- run-start buffs, the pick screen layout, startRun() -->
<script src="revive.js"></script>   <!-- death: revive countdown, game-over lockout -->
<script src="leaderboard.js"></script><!-- shared top-10 leaderboard (Supabase), initials box -->
<script src="enemies.js"></script>  <!-- enemy snakes, their AI, waves -->
<script src="render.js"></script>   <!-- all drawing; reads S, never changes it -->
<script src="panel.js"></script>   <!-- the info panel: head and skill timers, follower counts, wave info -->
<script src="input.js"></script>    <!-- keyboard, touch, pause -->
<script src="main.js"></script>     <!-- step(), loop(), starts the game -->
</body>
</html>
