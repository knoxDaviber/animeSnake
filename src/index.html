<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>animeSnake</title>
<style>
  html, body { margin: 0; height: 100%; background: #14101f; color: #f3e9ff; font-family: system-ui, sans-serif; overflow: hidden; touch-action: none; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; }
  #hud { display: flex; gap: 24px; font-size: 16px; }
  canvas {
    background: #1d1730; border: 2px solid #3a2d5c;
    width: min(96vw, 80vh, 640px); height: auto; aspect-ratio: 1 / 1;
    image-rendering: pixelated; /* keep pixel art crisp when the canvas is scaled */
  }
  #hint { font-size: 12px; opacity: .6; }
</style>
</head>
<body>
<div id="hud"><span>Score <b id="score">0</b></span><span>Chain <b id="len">3</b></span><span>Best <b id="best">0</b></span></div>
<canvas id="c" width="640" height="640"></canvas>
<div id="hint">Arrows / WASD / swipe to steer. P pauses. Tap to restart after dying.</div>
<script>
// Numbers from ART_SPEC.md: 32x32 tiles, 20x20 grid (640x640), 125 ms logic tick.
const COLS = 20, ROWS = 20, CELL = 32, TICK_MS = 125;
const SPRITE = 32; // size of one frame in a character sheet
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;

const COLORS = ['#ff6b9d', '#6bc5ff', '#ffd36b', '#8dff6b', '#c78bff']; // fallback if a sheet is missing

function loadSheet(src, expectW, expectH) {
  const s = { img: new Image(), ready: false };
  s.img.onload = () => {
    s.ready = true;
    if (expectW && (s.img.width !== expectW || s.img.height !== expectH))
      console.warn(`${src} is ${s.img.width}x${s.img.height}, expected ${expectW}x${expectH}`);
  };
  s.img.onerror = () => console.warn('Missing sprite sheet:', src);
  s.img.src = src;
  return s;
}

// ---- Character sprites -------------------------------------------------------
// One 128x128 sheet per character: 4 columns (animation frames) x 4 rows (movement direction).
// Row 0 = down, row 1 = right (mirrored for left), row 2 = up, row 3 = reserved.
// Frames loop left to right, 1 frame per logic tick.
const DIR_ROW = { down: 0, right: 1, up: 2 };
const FRAMES = 4;
// Add more names here as you export more sheets (assets/images/characters/<name>.png).
const CHARACTERS = ['character1'].map(name => ({
  name, ...loadSheet(`../assets/images/characters/${name}.png`, SPRITE * FRAMES, SPRITE * 4),
}));

// Draws one 32x32 frame at 1:1 into the tile at pixel (px, py). Art lives inside the 28x28 safe area.
function drawCharacter(ch, r, tick, px, py) {
  let row = DIR_ROW.right, flip = false;
  if (r.fy < 0) row = DIR_ROW.up;
  else if (r.fy > 0) row = DIR_ROW.down;
  else flip = r.fx < 0;
  const sx = (tick % FRAMES) * SPRITE, sy = row * SPRITE;
  if (flip) {
    ctx.save();
    ctx.translate(px + CELL, py);
    ctx.scale(-1, 1);
    ctx.drawImage(ch.img, sx, sy, SPRITE, SPRITE, 0, 0, SPRITE, SPRITE);
    ctx.restore();
  } else {
    ctx.drawImage(ch.img, sx, sy, SPRITE, SPRITE, px, py, SPRITE, SPRITE);
  }
}

// ---- Attacks -----------------------------------------------------------------
// Attacks are independent of the characters. Each has its own sheet: one row of frames, drawn facing right.
// They live in a separate list and are drawn on top of the grid, on the tile they hit.
// 1 attack frame = ticksPerFrame logic ticks. The hit resolves when the attack reaches hitFrame.
const ATTACKS = {
  sword: {
    sheet: loadSheet('../assets/images/attacks/slash_sword.png', 128, 32),
    frames: 4, w: 32, h: 32, ticksPerFrame: 1,
    hitFrame: 1,   // hit resolves at the start of tick 1
    cooldown: 6,   // ticks between swings (750 ms at base speed)
  },
};
let attacks = [], lastSwing = 0;

function fireAttack(def, tx, ty, d) {
  attacks.push({ def, x: tx, y: ty, dir: d, age: 0 });
}
// Placeholder: enemy snakes arrive in build step 3. For now the sword only plays its animation.
function resolveHit(a) { /* TODO: damage whatever occupies tile (a.x, a.y) */ }

function updateAttacks() {
  for (const a of attacks) {
    a.age++;
    if (a.age === a.def.hitFrame * a.def.ticksPerFrame) resolveHit(a);
  }
  attacks = attacks.filter(a => a.age < a.def.frames * a.def.ticksPerFrame);
  // Head auto-attacks in its facing direction on a timer.
  if (animTick - lastSwing >= ATTACKS.sword.cooldown) {
    const tx = snake[0].x + dir.x, ty = snake[0].y + dir.y;
    if (tx >= 0 && ty >= 0 && tx < COLS && ty < ROWS) {
      fireAttack(ATTACKS.sword, tx, ty, dir);
      lastSwing = animTick;
    }
  }
}
function drawAttack(a) {
  const d = a.def;
  if (!d.sheet.ready) return;
  const f = Math.floor(a.age / d.ticksPerFrame);
  ctx.save();
  ctx.translate(a.x * CELL + CELL / 2, a.y * CELL + CELL / 2);
  if (a.dir.x < 0) ctx.scale(-1, 1);                        // left: mirror
  else if (a.dir.y) ctx.rotate(a.dir.y * Math.PI / 2);      // up / down: rotate the FX
  ctx.drawImage(d.sheet.img, f * d.w, 0, d.w, d.h, -d.w / 2, -d.h / 2, d.w, d.h);
  ctx.restore();
}

// ---- Game state ------------------------------------------------------------
// snake  = tile positions (head first); roster = which character sits in each chain slot.
// prev   = tile positions one tick ago, used to interpolate rendering between ticks.
let snake, prev, roster, dir, nextDir, food, score, alive, paused = false;
let best = 0, last = 0, alpha = 1, animTick = 0;

function reset() {
  snake = [
    { x: 10, y: 10 },
    { x: 9, y: 10 },
    { x: 8, y: 10 },
  ];
  prev = snake.map(s => ({ ...s }));
  roster = snake.map((_, i) => ({ c: i % CHARACTERS.length, fx: 1, fy: 0 }));
  dir = nextDir = { x: 1, y: 0 };
  score = 0; alive = true; paused = false; animTick = 0; lastSwing = 0; alpha = 1;
  attacks = [];
  last = performance.now();
  placeFood(); hud();
}
function placeFood() {
  do { food = { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) }; }
  while (snake.some(s => s.x === food.x && s.y === food.y));
}
function hud() {
  document.getElementById('score').textContent = score;
  document.getElementById('len').textContent = snake.length;
  document.getElementById('best').textContent = best;
}
function setDir(x, y) {
  if (x === -dir.x && y === -dir.y) return; // no instant reverse
  nextDir = { x, y };
}
// Each segment faces the direction it is travelling in (the head faces the steering direction).
function faceSegments() {
  snake.forEach((s, i) => {
    roster[i].fx = i === 0 ? dir.x : snake[i - 1].x - s.x;
    roster[i].fy = i === 0 ? dir.y : snake[i - 1].y - s.y;
  });
}
function step() {
  dir = nextDir;
  const h = snake[0];
  const nx = h.x + dir.x, ny = h.y + dir.y;
  if (nx < 0 || ny < 0 || nx >= COLS || ny >= ROWS || snake.some(s => s.x === nx && s.y === ny)) {
    alive = false; alpha = 1; return;
  }
  prev = snake.map(s => ({ ...s }));
  const ate = nx === food.x && ny === food.y;
  snake.unshift({ x: nx, y: ny });
  if (ate) {
    const tail = roster[roster.length - 1];
    roster.push({ c: Math.floor(Math.random() * CHARACTERS.length), fx: tail.fx, fy: tail.fy });
    score += 10; placeFood();
  } else snake.pop();
  faceSegments();
  animTick++; // animation clock: 1 frame per tick
  updateAttacks();
  if (score > best) best = score;
  hud();
}

// ---- Rendering ---------------------------------------------------------------
function draw() {
  ctx.clearRect(0, 0, cv.width, cv.height);
  ctx.fillStyle = '#ff4d4d';
  ctx.fillRect(food.x * CELL + 6, food.y * CELL + 6, CELL - 12, CELL - 12);
  snake.forEach((s, i) => {
    const r = roster[i], ch = CHARACTERS[r.c % CHARACTERS.length];
    const p = prev[Math.min(i, prev.length - 1)];
    const px = (p.x + (s.x - p.x) * alpha) * CELL;
    const py = (p.y + (s.y - p.y) * alpha) * CELL;
    if (ch.ready) {
      drawCharacter(ch, r, animTick, Math.round(px), Math.round(py));
    } else { // fallback: colored squares
      ctx.fillStyle = COLORS[r.c % COLORS.length];
      ctx.fillRect(px + 2, py + 2, CELL - 4, CELL - 4);
      if (i === 0) { ctx.fillStyle = '#fff'; ctx.fillRect(px + 11, py + 11, 10, 10); }
    }
  });
  attacks.forEach(drawAttack); // attack layer sits on top of the characters
  if (!alive || paused) {
    ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.fillStyle = '#fff'; ctx.font = '36px system-ui'; ctx.textAlign = 'center';
    ctx.fillText(alive ? 'Paused' : 'Game over', cv.width / 2, cv.height / 2 - 10);
    ctx.font = '20px system-ui';
    ctx.fillText(alive ? 'Tap or press P to resume' : 'Tap or press Space to restart', cv.width / 2, cv.height / 2 + 28);
  }
}
function loop(t) {
  if (alive && !paused) {
    if (t - last >= TICK_MS) {
      last += TICK_MS;
      if (t - last >= TICK_MS) last = t; // fell far behind (slow device): don't fast-forward
      step();
    }
    if (alive) alpha = Math.min(1, Math.max(0, (t - last) / TICK_MS));
  }
  draw(); requestAnimationFrame(loop);
}

// ---- Pause -------------------------------------------------------------------
function pause() { if (alive) paused = true; }
function resume() {
  if (!paused) return;
  paused = false;
  last = performance.now() - alpha * TICK_MS; // continue mid-tick instead of skipping ahead
}
document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });
addEventListener('blur', pause);

// ---- Input -------------------------------------------------------------------
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (!alive && (k === ' ' || k === 'enter')) return reset();
  if (k === 'p' || k === 'escape') return paused ? resume() : pause();
  if (paused) return;
  if (k === 'arrowup' || k === 'w') setDir(0, -1);
  else if (k === 'arrowdown' || k === 's') setDir(0, 1);
  else if (k === 'arrowleft' || k === 'a') setDir(-1, 0);
  else if (k === 'arrowright' || k === 'd') setDir(1, 0);
});
let tx, ty;
addEventListener('touchstart', e => {
  tx = e.touches[0].clientX; ty = e.touches[0].clientY;
  if (!alive) reset(); else resume();
});
addEventListener('touchmove', e => {
  if (paused) return;
  const dx = e.touches[0].clientX - tx, dy = e.touches[0].clientY - ty;
  if (Math.abs(dx) < 24 && Math.abs(dy) < 24) return;
  if (Math.abs(dx) > Math.abs(dy)) setDir(dx > 0 ? 1 : -1, 0); else setDir(0, dy > 0 ? 1 : -1);
  tx = e.touches[0].clientX; ty = e.touches[0].clientY;
});
addEventListener('mousedown', () => { if (paused) resume(); });
reset(); requestAnimationFrame(loop);
</script>
</body>
</html>
