<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>animeSnake</title>
<style>
  html, body { margin: 0; height: 100%; background: #14101f; color: #f3e9ff; font-family: system-ui, sans-serif; overflow: hidden; touch-action: none; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; }
  #hud { display: flex; gap: 20px; font-size: 16px; }
  canvas {
    background: #1d1730; border: 2px solid #3a2d5c;
    width: min(96vw, 80vh, 640px); height: auto; aspect-ratio: 1 / 1;
    image-rendering: pixelated; /* keep pixel art crisp when the canvas is scaled */
  }
  #hint { font-size: 12px; opacity: .6; }
</style>
</head>
<body>
<div id="hud"><span>Score <b id="score">0</b></span><span>Chain <b id="len">3</b></span><span>Wave <b id="wave">1</b></span><span>Best <b id="best">0</b></span></div>
<canvas id="c" width="640" height="640"></canvas>
<div id="hint">Arrows / WASD / swipe to steer. P pauses. Tap to restart after dying.</div>
<script>
// Numbers from ART_SPEC.md: 32x32 tiles, 20x20 grid (640x640), 125 ms logic tick.
const COLS = 20, ROWS = 20, CELL = 32, TICK_MS = 125;
const SPRITE = 32; // size of one frame in a character / enemy / item sheet
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;

const COLORS = ['#ff6b9d', '#6bc5ff', '#ffd36b', '#8dff6b', '#c78bff']; // fallback if a sheet is missing
const DIRS = [{ x: 1, y: 0 }, { x: -1, y: 0 }, { x: 0, y: 1 }, { x: 0, y: -1 }];
const range = n => [...Array(n).keys()];

function loadSheet(src, expectW, expectH) {
  const s = { img: new Image(), ready: false };
  s.img.onload = () => {
    s.ready = true;
    if (expectW && (s.img.width !== expectW || s.img.height !== expectH))
      console.warn(`${src} is ${s.img.width}x${s.img.height}, expected ${expectW}x${expectH}`);
  };
  s.img.onerror = () => console.warn('Missing sprite sheet:', src);
  s.img.src = src;
  return s;
}

// ---- Sprites -----------------------------------------------------------------
// Every object has a placeholder PNG at its final path. Swap art by overwriting the file; no code changes.
//  * Directional sheets (characters, enemies): 128x128 = 4 frames x 4 rows (down, right, up, reserved).
//  * Item sheets (food, hazard, recruit): one row of 32x32 frames; frame count = width / 32.
const FRAMES = 4;
const DIR_ROW = { down: 0, right: 1, up: 2 };
const dirSheet = path => loadSheet(path, SPRITE * FRAMES, SPRITE * 4);
const SPRITES = {
  food:      loadSheet('../assets/images/food.png'),
  hazard:    loadSheet('../assets/images/hazard.png'),
  recruit:   loadSheet('../assets/images/recruit.png'), // not used until build step 6
  enemyHead: dirSheet('../assets/images/enemies/enemy_head.png'),
  enemyBody: dirSheet('../assets/images/enemies/enemy_body.png'),
};
// Add more names here as you export more sheets (assets/images/characters/<name>.png).
const CHARACTERS = ['character1'].map(name => {
  const ch = dirSheet(`../assets/images/characters/${name}.png`);
  ch.name = name; // keep the same object so onload can set ch.ready
  return ch;
});

// Draws one 32x32 frame of a directional sheet at 1:1. Sprites face right; left is mirrored.
function drawDirectional(sh, fx, fy, tick, px, py) {
  let row = DIR_ROW.right, flip = false;
  if (fy < 0) row = DIR_ROW.up;
  else if (fy > 0) row = DIR_ROW.down;
  else flip = fx < 0;
  const sx = (tick % FRAMES) * SPRITE, sy = row * SPRITE;
  if (flip) {
    ctx.save();
    ctx.translate(px + CELL, py);
    ctx.scale(-1, 1);
    ctx.drawImage(sh.img, sx, sy, SPRITE, SPRITE, 0, 0, SPRITE, SPRITE);
    ctx.restore();
  } else {
    ctx.drawImage(sh.img, sx, sy, SPRITE, SPRITE, px, py, SPRITE, SPRITE);
  }
}
function drawItem(sh, tick, px, py) {
  const frames = Math.max(1, Math.floor(sh.img.width / SPRITE));
  ctx.drawImage(sh.img, (tick % frames) * SPRITE, 0, SPRITE, SPRITE, px, py, SPRITE, SPRITE);
}

// ---- Attacks -----------------------------------------------------------------
// Attacks are independent of the characters. Each has its own sheet: equal-sized frames, drawn facing right.
// They live in a separate list and are drawn on top of the grid, on the tile they hit.
// 1 attack frame = ticksPerFrame logic ticks. The hit resolves when the attack reaches hitFrame.
const ATTACKS = {
  sword: {
    sheet: loadSheet('../assets/images/attacks/slash_sword.png'),
    w: 64, h: 41,  // size of ONE frame in the sheet (use 32 x 32 for tile-sized frames)
    fit: true,     // scale each frame down to fit inside one 32x32 tile (keeps aspect ratio)
    // frames: 4,  // optional: omit to count every frame in the sheet (left to right, top to bottom)
    ticksPerFrame: 1,
    hitFrame: 1,   // hit resolves at the start of tick 1
    cooldown: 6,   // ticks between swings (750 ms at base speed)
  },
};
function frameCount(d) {
  if (d.frames) return d.frames;
  const img = d.sheet.img;
  return d.sheet.ready ? Math.floor(img.width / d.w) * Math.floor(img.height / d.h) : 4;
}
let attacks = [], lastSwing = 0;

function fireAttack(def, tx, ty, d) {
  attacks.push({ def, x: tx, y: ty, dir: d, age: 0 });
}
// The sword hits the enemy segment on the target tile.
//  * Head: costs the enemy one hit point (hits needed grow with the wave). At zero the whole snake dies.
//  * Body segment: breaks it, and everything behind it is cut off.
function resolveHit(a) {
  const t = enemyAt(a.x, a.y);
  if (!t) return;
  const e = t.e;
  if (t.i === 0) { damageEnemyHead(e, 1); return; }
  const faces = e.segs.map((_, i) => faceOf(e, i));
  const cut = e.segs.splice(t.i);
  cut.forEach((s, k) => {
    const f = faces[t.i + k];
    dropFx(s.x, s.y, (px, py) => drawEnemySeg(false, f.fx, f.fy, px, py));
  });
  score += 5 * cut.length;
  e.stun = Math.max(e.stun, 2);
}
function updateAttacks() {
  for (const a of attacks) {
    a.age++;
    if (a.age === a.def.hitFrame * a.def.ticksPerFrame) resolveHit(a);
  }
  attacks = attacks.filter(a => a.age < frameCount(a.def) * a.def.ticksPerFrame);
  // Head auto-attacks in its facing direction on a timer.
  if (animTick - lastSwing >= ATTACKS.sword.cooldown) {
    const tx = snake[0].x + dir.x, ty = snake[0].y + dir.y;
    if (inBounds(tx, ty)) {
      fireAttack(ATTACKS.sword, tx, ty, dir);
      lastSwing = animTick;
    }
  }
}
function drawAttack(a) {
  const d = a.def;
  if (!d.sheet.ready) return;
  const f = Math.floor(a.age / d.ticksPerFrame);
  const cols = Math.max(1, Math.floor(d.sheet.img.width / d.w));
  const sx = (f % cols) * d.w, sy = Math.floor(f / cols) * d.h;
  const s = d.fit ? Math.min(CELL / d.w, CELL / d.h) : 1; // "contain" inside one tile
  const dw = Math.round(d.w * s), dh = Math.round(d.h * s);
  ctx.save();
  ctx.translate(a.x * CELL + CELL / 2, a.y * CELL + CELL / 2);
  if (a.dir.x < 0) ctx.scale(-1, 1);                        // left: mirror
  else if (a.dir.y) ctx.rotate(a.dir.y * Math.PI / 2);      // up / down: rotate the FX
  ctx.drawImage(d.sheet.img, sx, sy, d.w, d.h, -Math.floor(dw / 2), -Math.floor(dh / 2), dw, dh);
  ctx.restore();
}

// ---- Game state ------------------------------------------------------------
// snake  = tile positions (head first); roster = which character sits in each chain slot.
// prev   = tile positions one tick ago, used to interpolate rendering between ticks.
let snake, prev, roster, dir, nextDir, food, score, alive, paused = false;
let best = 0, last = 0, alpha = 1, animTick = 0;

function inBounds(x, y) { return x >= 0 && y >= 0 && x < COLS && y < ROWS; }

function reset() {
  snake = [
    { x: 10, y: 10 },
    { x: 9, y: 10 },
    { x: 8, y: 10 },
  ];
  prev = snake.map(s => ({ ...s }));
  roster = snake.map((_, i) => ({ c: i % CHARACTERS.length, fx: 1, fy: 0 }));
  dir = nextDir = { x: 1, y: 0 };
  score = 0; alive = true; paused = false; animTick = 0; lastSwing = 0; alpha = 1;
  attacks = []; drops = []; invuln = 0;
  enemies = []; wave = 0; toSpawn = 0; spawnTimer = 0; waveTimer = START_DELAY;
  last = performance.now();
  placeHazard(); placeFood(); hud();
}
function placeFood() {
  do { food = { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) }; }
  while (snake.some(s => s.x === food.x && s.y === food.y) || (food.x === hazard.x && food.y === hazard.y));
}
function hud() {
  document.getElementById('score').textContent = score;
  document.getElementById('len').textContent = snake.length;
  document.getElementById('wave').textContent = wave || 1;
  document.getElementById('best').textContent = best;
}

// ---- Rings and damage ------------------------------------------------------
// Walls, the hazard, enemy snakes and your own body each cost one character per hit. You die when none are left.
const INVULN_TICKS = 8;            // ticks of immunity after a hit (the chain blinks)
const DROP_TICKS = 4;              // length of the drop fade, in ticks
const SELF_HIT_COSTS_RING = true;  // false = running into your own body is instant death
let hazard, drops = [], invuln = 0;

function placeHazard() { // one static hazard tile, at least 5 tiles from the head
  do { hazard = { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) }; }
  while (Math.abs(hazard.x - snake[0].x) + Math.abs(hazard.y - snake[0].y) < 5);
}
// A drop effect: something fades out and floats up on a tile. draw(px, py) paints it.
function dropFx(x, y, draw) { drops.push({ x, y, age: 0, draw }); }
function ageDrops() {
  drops.forEach(d => d.age++);
  drops = drops.filter(d => d.age < DROP_TICKS);
}
function takeHit() {
  invuln = INVULN_TICKS;
  if (snake.length === 1) { alive = false; return; } // last character lost
  const t = snake.pop(), r = roster.pop();           // the tail character is the one dropped
  dropFx(t.x, t.y, (px, py) => drawSegment(r, px, py, false));
}

// ---- Enemy snakes and waves --------------------------------------------------
// Enemy = { segs: [{x,y}] head first, prev: segs one tick ago, dir, hp, stun }.
const ENEMY_CHASE = 0.6;   // chance per move that an enemy heads toward the player instead of wandering
const START_DELAY = 24;    // ticks before the first wave
const WAVE_DELAY = 16;     // ticks between a cleared wave and the next
const SPAWN_GAP = 10;      // ticks between enemies inside one wave
let enemies = [], wave = 0, toSpawn = 0, spawnTimer = 0, waveTimer = START_DELAY;

function hitsToKill(w) { return w <= 5 ? 1 : w <= 9 ? 2 : w <= 13 ? 3 : w <= 17 ? 4 : 5; } // from DESIGN.md
function waveSize(w) { return Math.min(1 + Math.floor(w / 3), 5); }

function enemyAt(x, y) {
  for (const e of enemies) {
    const i = e.segs.findIndex(s => s.x === x && s.y === y);
    if (i >= 0) return { e, i };
  }
  return null;
}
function enemyCanEnter(x, y) {
  return inBounds(x, y) && !(x === hazard.x && y === hazard.y) &&
    !snake.some(s => s.x === x && s.y === y) && !enemyAt(x, y);
}
function faceOf(e, i) {
  return i === 0 ? { fx: e.dir.x, fy: e.dir.y }
                 : { fx: e.segs[i - 1].x - e.segs[i].x, fy: e.segs[i - 1].y - e.segs[i].y };
}
function spawnEnemy() {
  const len = 3 + Math.min(Math.floor((wave - 1) / 3), 4);
  for (let tries = 0; tries < 40; tries++) {
    const side = Math.floor(Math.random() * 4);
    const c = Math.floor(Math.random() * (side < 2 ? ROWS : COLS));
    let d, segs; // the snake starts in a straight line along an edge, heading inward
    if (side === 0)      { d = DIRS[0]; segs = range(len).map(i => ({ x: len - 1 - i, y: c })); }
    else if (side === 1) { d = DIRS[1]; segs = range(len).map(i => ({ x: COLS - len + i, y: c })); }
    else if (side === 2) { d = DIRS[2]; segs = range(len).map(i => ({ x: c, y: len - 1 - i })); }
    else                 { d = DIRS[3]; segs = range(len).map(i => ({ x: c, y: ROWS - len + i })); }
    const far = Math.abs(segs[0].x - snake[0].x) + Math.abs(segs[0].y - snake[0].y) >= 6;
    if (far && segs.every(s => enemyCanEnter(s.x, s.y))) {
      enemies.push({ segs, prev: segs.map(s => ({ ...s })), dir: d, hp: hitsToKill(wave), stun: 0 });
      return true;
    }
  }
  return false;
}
function updateWaves() {
  if (toSpawn > 0) {
    if (--spawnTimer <= 0 && spawnEnemy()) { toSpawn--; spawnTimer = SPAWN_GAP; }
  } else if (enemies.length === 0) {
    if (--waveTimer <= 0) { wave++; toSpawn = waveSize(wave); spawnTimer = 0; waveTimer = WAVE_DELAY; }
  }
}
// Returns true if the enemy survived.
function damageEnemyHead(e, n) {
  e.hp -= n;
  if (e.hp <= 0) { killEnemy(e); return false; }
  e.stun = Math.max(e.stun, 2);
  return true;
}
function killEnemy(e) {
  enemies = enemies.filter(x => x !== e);
  e.segs.forEach((s, i) => {
    const f = faceOf(e, i);
    dropFx(s.x, s.y, (px, py) => drawEnemySeg(i === 0, f.fx, f.fy, px, py));
  });
  score += 20;
}
// Simple AI: never reverses, avoids walls, the hazard and other snakes. It chases the player's head
// most of the time and wanders otherwise. Moving into the player's head is a head-on collision.
function stepEnemy(e) {
  e.prev = e.segs.map(s => ({ ...s }));
  if (e.stun > 0) { e.stun--; return; }
  const head = e.segs[0], ph = snake[0];
  const opts = [];
  for (const d of DIRS) {
    if (d.x === -e.dir.x && d.y === -e.dir.y) continue;
    const x = head.x + d.x, y = head.y + d.y;
    if (x === ph.x && y === ph.y) opts.push({ d, x, y, headOn: true });
    else if (enemyCanEnter(x, y)) opts.push({ d, x, y });
  }
  if (!opts.length) return; // boxed in: wait a tick
  let pick;
  if (Math.random() < ENEMY_CHASE) {
    const dist = o => Math.abs(o.x - ph.x) + Math.abs(o.y - ph.y);
    pick = opts.reduce((a, b) => dist(b) < dist(a) ? b : a);
  } else pick = opts[Math.floor(Math.random() * opts.length)];
  if (pick.headOn) {
    if (invuln > 0) return;                 // player is immune: the enemy just waits
    takeHit();                              // head-on: both snakes take damage, short stun
    if (damageEnemyHead(e, 1)) e.stun = 4;
    return;
  }
  e.dir = pick.d;
  e.segs.unshift({ x: pick.x, y: pick.y });
  e.segs.pop();
}

// ---- Player movement ---------------------------------------------------------
function setDir(x, y) {
  if (x === -dir.x && y === -dir.y) return; // no instant reverse
  nextDir = { x, y };
}
// Each segment faces the direction it is travelling in (the head faces the steering direction).
function faceSegments() {
  snake.forEach((s, i) => {
    roster[i].fx = i === 0 ? dir.x : snake[i - 1].x - s.x;
    roster[i].fy = i === 0 ? dir.y : snake[i - 1].y - s.y;
  });
}
function playerMove() {
  dir = nextDir;
  const h = snake[0];
  const nx = h.x + dir.x, ny = h.y + dir.y;
  prev = snake.map(s => ({ ...s }));
  const self = snake.some(s => s.x === nx && s.y === ny);
  const en = enemyAt(nx, ny);
  const blocked = !inBounds(nx, ny) || self || en || (nx === hazard.x && ny === hazard.y);
  const wasInvuln = invuln > 0;
  if (invuln > 0) invuln--;
  if (blocked) {
    // Wall, hazard, enemy or own body: the snake stays put and loses one character (unless invulnerable).
    if (!wasInvuln) {
      if (self && !SELF_HIT_COSTS_RING) alive = false;
      else {
        takeHit();
        if (en && en.i === 0 && damageEnemyHead(en.e, 1)) en.e.stun = 4; // head-on: enemy is hurt too
      }
    }
    return;
  }
  const ate = nx === food.x && ny === food.y;
  snake.unshift({ x: nx, y: ny });
  if (ate) {
    const tail = roster[roster.length - 1];
    roster.push({ c: Math.floor(Math.random() * CHARACTERS.length), fx: tail.fx, fy: tail.fy });
    score += 10; placeFood();
  } else snake.pop();
  faceSegments();
}
function step() {
  animTick++; // animation clock: 1 frame per tick
  ageDrops();
  playerMove();
  if (alive) {
    updateAttacks();
    [...enemies].forEach(e => { if (alive && enemies.includes(e)) stepEnemy(e); });
    updateWaves();
  } else alpha = 1;
  if (score > best) best = score;
  hud();
}

// ---- Rendering ---------------------------------------------------------------
function drawSegment(r, px, py, isHead) {
  const ch = CHARACTERS[r.c % CHARACTERS.length];
  px = Math.round(px); py = Math.round(py);
  if (ch.ready) {
    drawDirectional(ch, r.fx, r.fy, animTick, px, py);
  } else { // fallback: colored squares
    ctx.fillStyle = COLORS[r.c % COLORS.length];
    ctx.fillRect(px + 2, py + 2, CELL - 4, CELL - 4);
    if (isHead) { ctx.fillStyle = '#fff'; ctx.fillRect(px + 11, py + 11, 10, 10); }
  }
}
function drawEnemySeg(isHead, fx, fy, px, py) {
  const sh = isHead ? SPRITES.enemyHead : SPRITES.enemyBody;
  px = Math.round(px); py = Math.round(py);
  if (sh.ready) {
    drawDirectional(sh, fx, fy, animTick, px, py);
  } else {
    ctx.fillStyle = isHead ? '#b45cff' : '#7a3fb5';
    ctx.fillRect(px + 2, py + 2, CELL - 4, CELL - 4);
  }
}
function drawHazard() {
  const x = hazard.x * CELL, y = hazard.y * CELL;
  if (SPRITES.hazard.ready) return drawItem(SPRITES.hazard, animTick, x, y);
  ctx.fillStyle = '#8a8aa3'; // fallback spikes
  for (let i = 0; i < 3; i++) {
    ctx.beginPath();
    ctx.moveTo(x + 2 + i * 10, y + CELL - 4);
    ctx.lineTo(x + 7 + i * 10, y + 6);
    ctx.lineTo(x + 12 + i * 10, y + CELL - 4);
    ctx.fill();
  }
}
function drawFood() {
  const x = food.x * CELL, y = food.y * CELL;
  if (SPRITES.food.ready) return drawItem(SPRITES.food, animTick, x, y);
  ctx.fillStyle = '#ff4d4d';
  ctx.fillRect(x + 6, y + 6, CELL - 12, CELL - 12);
}
function draw() {
  ctx.clearRect(0, 0, cv.width, cv.height);
  drawHazard();
  drawFood();
  enemies.forEach(e => {
    if (e.stun > 0 && animTick % 2 === 0) return; // blink while stunned
    e.segs.forEach((s, i) => {
      const p = e.prev[Math.min(i, e.prev.length - 1)];
      const f = faceOf(e, i);
      drawEnemySeg(i === 0, f.fx, f.fy, (p.x + (s.x - p.x) * alpha) * CELL, (p.y + (s.y - p.y) * alpha) * CELL);
    });
  });
  const blink = invuln > 0 && animTick % 2 === 0; // chain blinks while invulnerable
  if (!blink) snake.forEach((s, i) => {
    const p = prev[Math.min(i, prev.length - 1)];
    drawSegment(roster[i], (p.x + (s.x - p.x) * alpha) * CELL, (p.y + (s.y - p.y) * alpha) * CELL, i === 0);
  });
  drops.forEach(d => { // dropped characters fade out and float up
    ctx.save();
    ctx.globalAlpha = 1 - d.age / DROP_TICKS;
    d.draw(d.x * CELL, d.y * CELL - d.age * 3);
    ctx.restore();
  });
  attacks.forEach(drawAttack); // attack layer sits on top of everything else
  if (!alive || paused) {
    ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.fillStyle = '#fff'; ctx.font = '36px system-ui'; ctx.textAlign = 'center';
    ctx.fillText(alive ? 'Paused' : 'Game over', cv.width / 2, cv.height / 2 - 10);
    ctx.font = '20px system-ui';
    ctx.fillText(alive ? 'Tap or press P to resume' : 'Tap or press Space to restart', cv.width / 2, cv.height / 2 + 28);
  }
}
function loop(t) {
  if (alive && !paused) {
    if (t - last >= TICK_MS) {
      last += TICK_MS;
      if (t - last >= TICK_MS) last = t; // fell far behind (slow device): don't fast-forward
      step();
    }
    if (alive) alpha = Math.min(1, Math.max(0, (t - last) / TICK_MS));
  }
  draw(); requestAnimationFrame(loop);
}

// ---- Pause -------------------------------------------------------------------
function pause() { if (alive) paused = true; }
function resume() {
  if (!paused) return;
  paused = false;
  last = performance.now() - alpha * TICK_MS; // continue mid-tick instead of skipping ahead
}
document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });
addEventListener('blur', pause);

// ---- Input -------------------------------------------------------------------
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (!alive && (k === ' ' || k === 'enter')) return reset();
  if (k === 'p' || k === 'escape') return paused ? resume() : pause();
  if (paused) return;
  if (k === 'arrowup' || k === 'w') setDir(0, -1);
  else if (k === 'arrowdown' || k === 's') setDir(0, 1);
  else if (k === 'arrowleft' || k === 'a') setDir(-1, 0);
  else if (k === 'arrowright' || k === 'd') setDir(1, 0);
});
let tx, ty;
addEventListener('touchstart', e => {
  tx = e.touches[0].clientX; ty = e.touches[0].clientY;
  if (!alive) reset(); else resume();
});
addEventListener('touchmove', e => {
  if (paused) return;
  const dx = e.touches[0].clientX - tx, dy = e.touches[0].clientY - ty;
  if (Math.abs(dx) < 24 && Math.abs(dy) < 24) return;
  if (Math.abs(dx) > Math.abs(dy)) setDir(dx > 0 ? 1 : -1, 0); else setDir(0, dy > 0 ? 1 : -1);
  tx = e.touches[0].clientX; ty = e.touches[0].clientY;
});
addEventListener('mousedown', () => { if (paused) resume(); });
reset(); requestAnimationFrame(loop);
</script>
</body>
</html>
