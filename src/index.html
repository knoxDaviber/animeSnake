<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>animeSnake</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="hud"><span>Score <b id="score">0</b></span><span>Chain <b id="len">3</b></span><span>Wave <b id="wave">1</b></span><span>Combo <b id="combo">-</b></span><span>Best <b id="best">0</b></span><span>Best combo <b id="bestcombo">0</b></span></div>
<canvas id="c" width="640" height="640"></canvas>
<div id="hint">Arrows / WASD / swipe to steer. P pauses. Tap to restart after dying.</div>

<!-- Plain scripts (no server or build step needed). Order matters: each file may use the ones above it
     when it loads, and every function in any file when the game runs. -->
<script src="config.js"></script>   <!-- constants and tuning numbers -->
<script src="sprites.js"></script>  <!-- loads every sprite sheet -->
<script src="state.js"></script>    <!-- the S object: all mutable game state, newRun() -->
<script src="storage.js"></script>  <!-- saves best score and best combo in the browser -->
<script src="world.js"></script>    <!-- food, hazard, drop effects -->
<script src="score.js"></script>    <!-- points, combos, floating score text -->
<script src="player.js"></script>   <!-- steering, moving, rings and damage -->
<script src="attacks.js"></script>  <!-- attack definitions, swing timer, hit resolution -->
<script src="enemies.js"></script>  <!-- enemy snakes, their AI, waves -->
<script src="render.js"></script>   <!-- all drawing; reads S, never changes it -->
<script src="input.js"></script>    <!-- keyboard, touch, pause -->
<script src="main.js"></script>     <!-- step(), loop(), starts the game -->
</body>
</html>
